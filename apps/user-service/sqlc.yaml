version: "2"

sql:
  - schema: "db/migrations"
    queries: "db/queries"
    engine: "postgresql"

    gen:
      go:
        package: "db"
        out: "internal/adapters/repository/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_interface: true